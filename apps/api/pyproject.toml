[project]
name = "qfinance-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "razorpay>=1.4",
    "httpx>=0.27",
    "kiteconnect>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Added to fix a real cross-event-loop Redis failure (see
# apps/api/tests/conftest.py's module docstring §2 for the full root-cause
# explanation): app-level Redis clients (session_store.py/token_store.py) are
# module-scope singletons whose connection pool binds to whichever event loop
# first uses them. pytest-asyncio's default is a NEW event loop per test
# function, so any fixture touching that shared singleton across more than one
# test function fails on the second test with "Future ... attached to a
# different loop" / "Event loop is closed". Forcing one shared event loop for
# the whole test session (matching how the real application actually runs —
# one long-lived process, one loop, module-level clients created once) removes
# the mismatch entirely, without changing application code. This is test
# configuration, not packaging/dependency cleanup.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
